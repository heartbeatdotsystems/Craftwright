name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Probe Minecraft signatures
        run: ./scripts/probe-signatures.sh build/probe && cat build/probe/classes.txt
      - uses: actions/upload-artifact@v5
        with:
          name: probe
          path: build/probe
