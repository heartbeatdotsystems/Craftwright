name: Probe Minecraft signatures

# Porting aid: dumps the signatures of the client classes the agent touches
# to the branch "probe-output". Run it when moving to a new Minecraft version.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, probe-output]
    paths: ['scripts/probe-**', '.github/workflows/probe.yml', 'gradle.properties']

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Resolve Minecraft
        run: ./gradlew :agent:compileJava --no-daemon
      - name: Probe
        run: ./scripts/probe-signatures.sh "$RUNNER_TEMP/probe"
      - name: Push to probe-output
        run: |
          cd "$RUNNER_TEMP/probe"
          git init -q -b probe-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Signatures for $(grep minecraft_version "$GITHUB_WORKSPACE/gradle.properties")"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
