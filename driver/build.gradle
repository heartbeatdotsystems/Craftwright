plugins {
	id 'java-library'
}

repositories {
	mavenCentral()
}

dependencies {
	api 'com.google.code.gson:gson:2.13.2'

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

// The agent mod travels inside the driver jar, so users need a single dependency.
def agentJar = project(':agent').tasks.named('jar')
processResources {
	from(agentJar) {
		into 'craftwright/agents'
		rename { "fabric-${rootProject.minecraft_version}.jar" }
	}
}

test {
	useJUnitPlatform {
		excludeTags 'e2e'
	}
}

// Starts a real Paper server and a real Minecraft client. Needs network access and a few minutes.
tasks.register('e2eTest', Test) {
	description = 'Runs Craftwright against a real server and a real client.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	systemProperty 'craftwright.dir', layout.buildDirectory.dir('craftwright').get().asFile.absolutePath
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat 'full'
		showStandardStreams = true
	}
}
