plugins {
	id 'java-library'
}

repositories {
	mavenCentral()
}

dependencies {
	api project(':driver')
	api platform('org.junit:junit-bom:5.13.4')
	api 'org.junit.jupiter:junit-jupiter-api'

	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform {
		excludeTags 'e2e'
	}
}

tasks.register('e2eTest', Test) {
	description = 'Runs the JUnit extension against a real server and a real client.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	systemProperty 'craftwright.dir', layout.buildDirectory.dir('craftwright').get().asFile.absolutePath
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat 'full'
		showStandardStreams = true
	}
}
tasks.named('e2eTest') { mustRunAfter(':driver:e2eTest') }
